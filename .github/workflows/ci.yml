name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - deploy

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      SECRET_SALT: ci-secret-salt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
